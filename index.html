<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <div id="maincontainer">
      <span class="scoreboard">Score:0</span><br /><span class="highscore"
        >HighScore:0</span
      >
      <div class="MenuBtn" data-bs-toggle="modal" data-bs-target="#Menu-modal">
        <i class="fa-solid fa-ellipsis"></i>
      </div>
      <!-- <div class="mutebox">
          <i class="fa fa-volume-xmark" aria-hidden="true"></i>
        </div> -->
      <div class="modal" id="Menu-modal" style="display: none">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header justify-content-center">
              <h6 class="">Snake Game Version 1.0.0</h6>
            </div>
            <div class="modal-body text-start border border-primary">
              <div class="Modal-menu d-flex">
                <i class="fa-solid fa-square-minus"></i>
                <input type="number" value="3" min="1" max="7" />
                <i class="fa-solid fa-square-plus"></i>
              </div>
              <div class="mutebox">
                <i class="fa fa-volume-xmark" aria-hidden="true"></i>
                <input type="range" min="0" max="1" value="1" step="0.01" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="board">
        <div id="onscreen-area">
          <button>click</button>
        </div>
      </div>
      <div id="controlbox">
        <i class="fa-solid fa-up-long" style="color: rgb(85, 185, 55)"></i>
        <i class="fa-solid fa-down-long" style="color: rgb(85, 185, 55)"></i>
        <i class="fa-solid fa-right-long" style="color: rgb(85, 185, 55)"></i>
        <i class="fa-solid fa-left-long" style="color: rgb(85, 185, 55)"></i>
      </div>
    </div>
    <script src="JS/index.js"></script>
  </body>
</html>
